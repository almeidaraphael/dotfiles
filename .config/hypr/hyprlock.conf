source = $HOME/.config/hypr/active-theme.conf
source = $HOME/.config/hypr/active-wallpaper.conf

$font = FiraCode Nerd Font

# GENERAL
general {
    hide_cursor = true
}

# MOTION — fade signals the lock/unlock transition, dot growth signals typing
# feedback; reuses the shell's "smoothIn" curve (see hypr/theme.lua) rather
# than inventing a new easing family. Nothing decorative added beyond this.
animations {
    enabled = true
    bezier = smoothIn, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, smoothIn
    animation = fadeOut, 1, 3, smoothIn
    animation = inputFieldDots, 1, 2, smoothIn
}

# BACKGROUND — blurred, flat (no panel). hyprlock's `shape` widget has no
# blur field and `image` can't stand in for a localized blurred crop (its
# `size` is square-only, no blur_passes/blur_size on this version) —
# confirmed by direct testing. Full-background blur is the only mechanism
# this ecosystem exposes. Path is reused from Quickshell's WallpaperService
# via active-wallpaper.conf instead of a separate hardcoded lockscreen image.
background {
    monitor =
    path = $lockWallpaper
    blur_passes = 2
    blur_size = 7
    color = $background
}

# CLOCK + DATE — DP-1 only. Full identity/auth block (clock, avatar,
# username, password, status) is scoped to the primary monitor now instead
# of duplicating on every output — matches brief principle 4 ("less is
# more": a duplicated password pill on a screen you're not looking at is
# noise, not redundancy-as-safety) and the macOS/Windows/GNOME convention
# of one auth focal point, other displays ambient. Centered in the space
# above the avatar/username/password block (computed against DP-1's 1440p:
# block top edge sits at y=117, so the clock+date group is centered in the
# 117-720 zone above it, not just an arbitrary offset). hyprlock has no
# dynamic anchor layout (unlike the SDDM theme's real Qt Quick anchors) —
# these are fixed pixel offsets, re-check with `hyprlock &` if DP-1's
# resolution changes.
label {
    monitor = DP-1
    text = $TIME
    color = $light
    font_size = 110
    font_family = $font
    position = 0, 442
    halign = center
    valign = center
}
label {
    monitor = DP-1
    text = cmd[update:43200000] echo "$(date +"%A, %d %B")"
    color = $light
    font_size = 20
    font_family = $font
    position = 0, 343
    halign = center
    valign = center
}

# AVATAR — sourced from the world-readable asset dir so the same file SDDM
# and the Quickshell Dashboard read stays in sync with what shows here.
# Top of the whole avatar/username/password block; block is centered on
# screen (spans y=117 down to y=-117), both pills now the same 320x52 size.
# DP-1 only, see clock/date note above.
image {
    monitor = DP-1
    path = /etc/theme-assets/avatar.png
    size = 96
    rounding = -1
    border_size = 2
    border_color = $purple
    position = 0, 69
    halign = center
    valign = center
}

# USERNAME — display only (hyprlock auths the already-logged-in user, no
# real entry needed), but styled to match SDDM's real username field:
# fake pill (shape) + icon + divider + $USER text, all overlaid since
# hyprlock widgets can't contain children.
shape {
    monitor = DP-1
    size = 320, 52
    rounding = 26
    color = $glassFill
    border_size = 1
    border_color = $purple
    position = 0, -25
    halign = center
    valign = center
}
label {
    monitor = DP-1
    text = 󰀄
    color = $light
    font_size = 16
    font_family = $font
    position = -130, -25
    halign = center
    valign = center
}
label {
    monitor = DP-1
    text = $USER
    color = $light
    font_size = 15
    font_family = $font
    position = 0, -25
    halign = center
    valign = center
}

# PASSWORD — same icon+divider treatment overlaid on the real input-field.
# Placeholder/dots render centered within the full 320px pill regardless of
# this overlay (input-field has no internal padding/alignment options), but
# at this width they stay well clear of the icon zone on the left for any
# realistic password length.
label {
    monitor = DP-1
    text = 󰌾
    color = $light
    font_size = 16
    font_family = $font
    position = -130, -91
    halign = center
    valign = center
}
input-field {
    monitor = DP-1
    size = 320, 52
    outline_thickness = 2
    rounding = 26
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $purple
    inner_color = $glassFill
    font_color = $light
    fade_on_empty = false
    placeholder_text = <span foreground="##$lightHex">Password</span>
    hide_input = false
    check_color = $green
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $orange
    position = 0, -91
    halign = center
    valign = center
}


# DP-2 AMBIENT BLOCK — secondary monitor gets its own small job (glanceable
# time + what's playing) instead of a shrunk duplicate of DP-1's identity
# block. Corner-anchored, small scale, so it reads as "this screen's thing"
# rather than "the big clock failed to load here." Status label (now-playing
# via lock-status.sh) moved here from DP-1 — frees DP-1 to be purely the
# unlock focal point.
#
# Y-axis note (found via a real render, not guessed): hyprlock's Y is
# OpenGL-convention (positive = up). valign=top + a positive Y therefore
# pushes the label further above the screen, off-canvas — confirmed via a
# `grim` screenshot during a real (briefly locked, immediately killed)
# hyprlock test run: the pre-existing valign=bottom status label (positive
# Y, moves it up off the bottom edge into view) rendered fine, these two
# valign=top labels didn't render at all until Y was flipped negative.
label {
    monitor = DP-2
    text = $TIME
    color = $light
    font_size = 32
    font_family = $font
    position = 48, -48
    halign = left
    valign = top
}
label {
    monitor = DP-2
    text = cmd[update:43200000] echo "$(date +"%A, %d %B")"
    color = $light
    font_size = 15
    font_family = $font
    position = 48, -92
    halign = left
    valign = top
}
label {
    monitor = DP-2
    text = cmd[update:3000] $HOME/.config/hypr/scripts/lock-status.sh
    color = $light
    font_size = 14
    font_family = $font
    position = 48, 48
    halign = left
    valign = bottom
}
