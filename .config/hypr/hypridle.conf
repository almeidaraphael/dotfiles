general {
    lock_cmd = pidof hyprlock || hyprlock                                           # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                        # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'                          # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 300                                                                   # 5min.
    on-timeout = $HOME/.config/hypr/scripts/brightness.sh 10                # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = $HOME/.config/hypr/scripts/brightness.sh 100                # monitor backlight restore.
}

listener {
    timeout = 480                                                                   # 8min
    on-timeout = loginctl lock-session                                              # lock screen when timeout has passed
}

listener {
    timeout = 900                                                                   # 15min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'                              # turn off display after 15min of inactivity.
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'                                # turn on display when activity is detected after timeout has fired.
}
