context.modules = [
{   name = libpipewire-module-filter-chain
    args = {
        node.description = "AM8T Noise Suppressed"
        media.name       = "AM8T Noise Suppressed"
        filter.graph = {
            nodes = [
                # RNNoise first: removes steady highway/traffic noise before gate sees the signal
                {
                    type   = lv2
                    name   = rnnoise
                    plugin = "https://github.com/werman/noise-suppression-for-voice#mono"
                    label  = rnnoise
                    control = {
                        "VAD Threshold (%)" = 85.0
                    }
                }
                # Gate: silences mic between words on the already-cleaned signal
                {
                    type   = lv2
                    name   = gate
                    plugin = "http://lsp-plug.in/plugins/lv2/gate_mono"
                    label  = gate_mono
                    control = {
                        "gt"   = 0.010000  # threshold ~-40dB; raise to 0.031622 (-30dB) if gate opens on background voice
                        "gr"   = 0.000251  # reduction ~-72dB (max) when closed
                        "at"   = 1.0       # attack ms
                        "rt"   = 150.0     # release ms
                        "sla"  = 5.0       # lookahead ms - gate opens 5ms before word hits threshold, prevents clipping onsets
                        "shpm" = 2         # sidechain HPF 24dB/oct - ignore sub-bass in detection
                        "shpf" = 80.0      # sidechain HPF cutoff Hz
                    }
                }
                # Compressor: gentle 3:1 to even out voice dynamics
                {
                    type   = lv2
                    name   = comp
                    plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
                    label  = compressor_mono
                    control = {
                        "al" = 0.125893  # threshold ~-18dB
                        "at" = 10.0      # attack ms
                        "rt" = 100.0     # release ms
                        "cr" = 3.0       # ratio 3:1
                        "mk" = 1.584893  # makeup gain ~+4dB - compensates level loss from gate+rnnoise
                    }
                }
            ]
            links = [
                { output = "rnnoise:audio_out_1" input = "gate:in" }
                { output = "gate:out"            input = "comp:in" }
            ]
            inputs  = [ "rnnoise:audio_in_1" ]
            outputs = [ "comp:out" ]
        }
        capture.props = {
            node.name   = "capture.rnnoise_source"
            audio.channels = 1
            audio.rate     = 48000
            node.target    = "alsa_input.usb-MV-SILICON_fifine_Microphone_20190808-00.mono-fallback"
        }
        playback.props = {
            node.name   = "rnnoise_source"
            media.class = Audio/Source
            node.passive = true
            audio.channels = 1
            audio.rate     = 48000
        }
    }
}
]
